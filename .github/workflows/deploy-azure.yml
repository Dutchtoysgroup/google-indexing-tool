name: Deploy indexing pipeline to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package application and WebJob
        run: zip -qr app.zip . -x '.git/*' '.github/*' '__pycache__/*'
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: dtg-google-indexing-pipeline-weu
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
      - name: Register indexing WebJob
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: python scripts/deploy_webjob.py
