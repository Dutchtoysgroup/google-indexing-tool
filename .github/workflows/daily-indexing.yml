name: Daily Indexing Pipeline

on:
  schedule:
    # Dagelijks om 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run indexing pipeline
        env:
          DATABASE_URL: ${{ secrets.INDEXING_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python main.py
