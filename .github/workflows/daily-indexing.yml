name: Daily Indexing Pipeline

on:
  # Schedule uitgeschakeld - dagelijkse run draait nu lokaal op de Mac mini
  # via launchd (zie ~/Library/LaunchAgents/com.exittoys.indexing.plist).
  # Handmatig triggeren blijft mogelijk via "Run workflow" in de Actions UI;
  # daarbij gelden de defaults in config/settings.py (15 inspecties/shop)
  # zodat de run binnen het 40-minuten timeout past.
  workflow_dispatch: {}

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run indexing pipeline
        env:
          DATABASE_URL: ${{ secrets.INDEXING_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python main.py
